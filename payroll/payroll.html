<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payroll Processing - SELF HRMS</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="topbar">
  <div>
    <h1>SELF HRMS</h1>
    <p>Payroll Processing</p>
  </div>
</header>

<main class="container">

  <div class="page-heading">
    <h2>Payroll Processing</h2>
    <p>Calculate and manage monthly employee payroll</p>
  </div>

  <div class="actions-bar">
    <a href="../index.html" class="btn btn-secondary">
      ← Dashboard
    </a>
  </div>


  <section class="form-card">

    <form id="payrollForm">

      <input type="hidden" id="recordId">

      <h3>Payroll Selection</h3>

      <div class="form-grid">

        <div class="field">
          <label>Payroll Month *</label>
          <input
            type="month"
            id="payrollMonth"
            required
          >
        </div>

        <div class="field">
          <label>Employee *</label>
          <select id="employee" required>
            <option value="">Select Employee</option>
          </select>
        </div>

        <div class="field">
          <label>Monthly Salary</label>
          <input
            type="number"
            id="monthlySalary"
            readonly
          >
        </div>

        <div class="field">
          <label>Salary Divisor</label>
          <input
            type="number"
            id="salaryDivisor"
            min="1"
            step="1"
            value="26"
          >
        </div>

      </div>


      <h3>Attendance Summary</h3>

      <div class="form-grid">

        <div class="field">
          <label>Present Days</label>
          <input type="number" id="presentDays" readonly>
        </div>

        <div class="field">
          <label>Half Days</label>
          <input type="number" id="halfDays" readonly>
        </div>

        <div class="field">
          <label>Paid Leave</label>
          <input type="number" id="paidLeave" readonly>
        </div>

        <div class="field">
          <label>Unpaid Leave</label>
          <input type="number" id="unpaidLeave" readonly>
        </div>

        <div class="field">
          <label>Absent Days</label>
          <input type="number" id="absentDays" readonly>
        </div>

        <div class="field">
          <label>Weekly Off</label>
          <input type="number" id="weeklyOff" readonly>
        </div>

        <div class="field">
          <label>Holiday</label>
          <input type="number" id="holidayDays" readonly>
        </div>

        <div class="field">
          <label>Paid Days</label>
          <input type="number" id="paidDays" readonly>
        </div>

      </div>


      <h3>Overtime</h3>

      <div class="form-grid">

        <div class="field">
          <label>Total OT Hours</label>
          <input
            type="number"
            id="otHours"
            min="0"
            step="0.01"
            readonly
          >
        </div>

        <div class="field">
          <label>OT Rate Per Hour</label>
          <input
            type="number"
            id="otRate"
            min="0"
            step="0.01"
            value="0"
          >
        </div>

        <div class="field">
          <label>OT Amount</label>
          <input
            type="number"
            id="otAmount"
            readonly
          >
        </div>

      </div>


      <h3>Salary Calculation</h3>

      <div class="form-grid">

        <div class="field">
          <label>Per Day Salary</label>
          <input
            type="number"
            id="perDaySalary"
            readonly
          >
        </div>

        <div class="field">
          <label>Attendance Salary</label>
          <input
            type="number"
            id="attendanceSalary"
            readonly
          >
        </div>

        <div class="field">
          <label>Other Earnings</label>
          <input
            type="number"
            id="otherEarnings"
            min="0"
            step="0.01"
            value="0"
          >
        </div>

        <div class="field">
          <label>Bonus</label>
          <input
            type="number"
            id="bonus"
            min="0"
            step="0.01"
            value="0"
          >
        </div>

        <div class="field">
          <label>Gross Earnings</label>
          <input
            type="number"
            id="grossEarnings"
            readonly
          >
        </div>

      </div>


      <h3>Deductions</h3>

      <div class="form-grid">

        <div class="field">
          <label>PF Deduction</label>
          <input
            type="number"
            id="pfDeduction"
            min="0"
            step="0.01"
            value="0"
          >
        </div>

        <div class="field">
          <label>ESI Deduction</label>
          <input
            type="number"
            id="esiDeduction"
            min="0"
            step="0.01"
            value="0"
          >
        </div>

        <div class="field">
          <label>Advance Deduction</label>
          <input
            type="number"
            id="advanceDeduction"
            min="0"
            step="0.01"
            value="0"
          >
        </div>

        <div class="field">
          <label>Other Deduction</label>
          <input
            type="number"
            id="otherDeduction"
            min="0"
            step="0.01"
            value="0"
          >
        </div>

        <div class="field">
          <label>Total Deduction</label>
          <input
            type="number"
            id="totalDeduction"
            readonly
          >
        </div>

      </div>


      <h3>Net Salary</h3>

      <div class="form-grid">

        <div class="field">
          <label>Net Payable Salary</label>
          <input
            type="number"
            id="netSalary"
            readonly
          >
        </div>

        <div class="field">
          <label>Payroll Status</label>

          <select id="payrollStatus">
            <option value="Draft">Draft</option>
            <option value="Generated">Generated</option>
            <option value="Paid">Paid</option>
          </select>
        </div>

      </div>


      <div class="field">
        <label>Remarks</label>

        <textarea
          id="remarks"
          rows="3"
          placeholder="Optional payroll remarks"
        ></textarea>
      </div>


      <div class="form-actions">

        <button
          type="button"
          class="btn btn-secondary"
          id="calculateBtn"
        >
          Calculate Payroll
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          id="saveBtn"
        >
          Save Payroll
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          id="cancelBtn"
        >
          Clear
        </button>

      </div>

      <p id="message"></p>

    </form>

  </section>


  <section class="table-card">

    <div class="table-header">

      <h3>Payroll Records</h3>

      <input
        type="search"
        id="payrollSearch"
        placeholder="Search employee/month..."
      >

    </div>

    <div class="table-responsive">

      <table>

        <thead>
          <tr>
            <th>Month</th>
            <th>Employee</th>
            <th>Paid Days</th>
            <th>OT Hours</th>
            <th>Gross</th>
            <th>Deduction</th>
            <th>Net Salary</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="payrollTable"></tbody>

      </table>

    </div>

  </section>

</main>

<div id="toast" class="toast"></div>

<script src="../js/modules/payroll.js"></script>

</body>
</html>
